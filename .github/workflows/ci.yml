name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Test tooling
        run: |
          sudo apt-get install -y ripgrep
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash
      - run: npm ci
      # Private pin-depends (datascript-ocaml) need a PAT with repo read access.
      - env:
          LOGSEQ_GITHUB_PAT: ${{ secrets.LOGSEQ_GITHUB_PAT }}
        run: |
          git config --global url."https://x-access-token:${LOGSEQ_GITHUB_PAT}@github.com/".insteadOf "https://github.com/"
      - run: opam install . --deps-only --with-test
      - run: opam install .
      - run: opam exec -- sh test/compiler_cold_build_performance_gate_test.sh
        env:
          # 2-core hosted runners need ~3x the local dev limit.
          LG_COLD_BUILD_LIMIT_SECONDS: "45"
      # Restored before the gates that don't need a cold tree: the cold-build
      # gate above would silently hit .lg-cache / dune shared-cache artifacts.
      - name: Restore build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/dune
            .lg-cache
          key: build-cache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ github.ref_name }}-
            build-cache-main-
      - name: Enable dune shared cache
        run: |
          mkdir -p ~/.config/dune
          printf '(lang dune 3.0)\n(cache enabled)\n' > ~/.config/dune/config
      - run: opam exec -- dune build --action-stderr-on-success=must-be-empty @runtest
      # The default 430MB limit assumes a smaller tree; a full @runtest build on
      # the runner is ~590MB (mostly compiled test executables).
      - run: opam exec -- sh test/build_footprint_gate_test.sh _build
        env:
          LG_BUILD_FOOTPRINT_LIMIT_KIB: "819200"
          LG_TEST_BUILD_FOOTPRINT_LIMIT_KIB: "358400"
      - run: opam exec -- dune build @jsoo-cross-runtime
      # The smoke rules compile against installed lg-test cmi under
      # _build/install, which opam's -p builds never populate in-tree.
      # @install must complete first: the smoke rules read those files without
      # declaring them as deps, so a single invocation can schedule smoke first.
      - run: opam exec -- dune build @install
      - run: opam exec -- dune build @test/clojure_suite/clojure-test-suite-smoke
      - run: opam exec -- sh test/install_smoke.sh
      - run: opam lint .
      - name: Save build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/dune
            .lg-cache
          key: build-cache-${{ github.ref_name }}-${{ github.sha }}
